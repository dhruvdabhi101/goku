[package]
name = "goku-node"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
goku-core = { path = "../../crates/goku-core" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
